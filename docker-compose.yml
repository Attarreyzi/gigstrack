version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: GigsSTRACK_postgres
    restart: always
    environment:
      POSTGRES_DB: GigsSTRACK_db
      POSTGRES_USER: GigsSTRACK_user
      POSTGRES_PASSWORD: GigsSTRACK_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: GigsSTRACK_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-GigsSTRACK-dev-key-change-in-prod
      - DATABASE_URL=postgresql://GigsSTRACK_user:GigsSTRACK_password@postgres:5432/GigsSTRACK_db
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: GigsSTRACK_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
